name: Build Mods

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Show repo files
        run: ls -R . | head -80

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build every Gradle project found
        run: |
          found=0
          for g in $(find . -name gradlew -not -path "*/node_modules/*"); do
            dir=$(dirname "$g")
            echo "=== Building $dir ==="
            chmod +x "$g"
            (cd "$dir" && ./gradlew build)
            found=1
          done
          if [ "$found" = 0 ]; then
            echo "No gradlew found anywhere in the repo"
            exit 1
          fi

      - name: Upload the jars
        uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
