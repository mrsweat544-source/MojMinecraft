name: Build Mods

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [econmod, storageesp]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Show repo files
        run: find . -path ./.git -prune -o -type f -print | sort

      - name: Check project folder exists
        run: |
          if [ ! -f "${{ matrix.project }}/build.gradle" ]; then
            echo "MISSING: ${{ matrix.project }}/build.gradle - folder or file not committed (check the name and case)"
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Build the mod
        working-directory: ${{ matrix.project }}
        run: gradle build --no-daemon

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-jar
          path: |
            ${{ matrix.project }}/build/libs/*.jar
            !${{ matrix.project }}/build/libs/*-sources.jar
